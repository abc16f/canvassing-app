<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Poncey-Highland canvassing plan</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css">
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, sans-serif; }
  #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; }
  #panel { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 1000; background: #fff;
           border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.2); padding: 10px 12px; font-size: 14px; max-width: 520px; margin: 0 auto; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .stat { flex: 1; background: #f3f2ee; border-radius: 8px; padding: 6px 8px; min-width: 90px; }
  .stat b { display: block; font-size: 20px; }
  .muted { color: #666; font-size: 12px; }
  button { font-size: 13px; padding: 6px 10px; border: 1px solid #bbb; border-radius: 8px; background: #fff; }
  .chips span { display: inline-block; border: 1px solid #bbb; border-radius: 8px; padding: 2px 8px; margin: 2px 2px 0 0; font-size: 12px; cursor: pointer; }
  .chips span.on { background: #e6f1fb; border-color: #378add; color: #0c447c; }
  .leaflet-routing-container { display: none; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <div class="row" style="justify-content:space-between">
    <b>Poncey-Highland</b>
    <span class="muted" id="routeInfo">Tap the map to add stops</span>
  </div>
  <div class="row" style="margin-top:6px">
    <div class="stat"><span class="muted">Home doors on route</span><b id="homeCount">0</b></div>
    <div class="stat"><span class="muted">Other doors on route</span><b id="otherCount">0</b></div>
  </div>
  <div class="chips" style="margin-top:6px"><span class="muted">Visited in last: </span>
    <span data-days="7">7 days</span><span data-days="30" class="on">30 days</span><span data-days="90">90 days</span><span data-days="182">6 months</span><span data-days="365">1 year</span>
  </div>
  <div class="row" style="margin-top:6px">
    <button id="undo">Undo last stop</button>
    <button id="loop">Close the loop</button>
    <button id="clear">Clear route</button>
    <label class="muted">Counts doors within <select id="buffer"><option>30</option><option>40</option><option selected>50</option><option>60</option><option>80</option></select> m</label>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
<script>
// Map centered on Poncey-Highland, with OpenStreetMap streets underneath.
const map = L.map('map', { zoomControl: false }).setView([33.7725, -84.3575], 16);
L.control.zoom({ position: 'topright' }).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 20, subdomains: 'abcd', attribution: '&copy; OpenStreetMap contributors &copy; CARTO' }).addTo(map);

// Official Poncey-Highland outline from the City of Atlanta. If the city's server blocks the request, the map still works without it.
fetch("https://gis.atlantaga.gov/dpcd/rest/services/AdministrativeArea/GeopoliticalArea/MapServer/1/query?where=NAME%3D'Poncey-Highland'&returnGeometry=true&outSR=4326&f=geojson")
  .then(r => r.json()).then(g => L.geoJSON(g, { style: { color: '#534AB7', weight: 2, fill: false, dashArray: '4 4' } }).addTo(map))
  .catch(() => {});

const STATUS_COLOR = { 'visited': '#1D9E75', 'not visited': '#888780', 'contacted, not visited': '#BA7517' };
let homes = [], places = [], routeLine = null, bufferM = 50;

function loadCsv(path) {
  return new Promise((ok, fail) => Papa.parse(path, { download: true, header: true, skipEmptyLines: true, complete: r => ok(r.data), error: fail }));
}

Promise.all([loadCsv('data/home_doors.csv'), loadCsv('data/nonres_public.csv')]).then(([h, p]) => {
  homes = h.map(d => {
    const apt = d.building_type === 'apartment building';
    const label = `${d.building_address}${d.unit ? ', Unit ' + d.unit : ''}<br>${d.building_type} · ${d.home_doors} home door${d.home_doors === '1' ? '' : 's'}`;
    const m = L.circleMarker([+d.lat, +d.lon], { radius: apt ? 7 : 3, color: apt ? '#534AB7' : '#5F5E5A', weight: 1, fillOpacity: 0.7 })
      .bindTooltip(label).bindPopup(label).addTo(map);
    return { ...d, n: +d.home_doors, pt: turf.point([+d.lon, +d.lat]), marker: m, apt };
  });
  places = p.map(d => {
    const label = `<b>${d.name}</b><br>${d.type} · ${d.address}<br>Status: ${d.status}${d.last_visit ? ' (' + d.last_visit + ')' : ''}${d.shared_address_with ? '<br>Shares this address with ' + d.shared_address_with : ''}`;
    const m = L.circleMarker([+d.lat, +d.lon], { radius: 8, color: d.shared_address_with ? '#444' : '#fff', weight: 2, fillColor: STATUS_COLOR[d.status] || '#888780', fillOpacity: 1 })
      .bindTooltip(label).bindPopup(label).addTo(map);
    return { ...d, pt: turf.point([+d.lon, +d.lat]), marker: m };
  });
}).catch(e => alert('Could not load the data files: ' + e));

// Walking routes come from the free FOSSGIS routing server, which asks for at most one request per second, so the route redraws only after a drag ends.
const router = L.Routing.osrmv1({ serviceUrl: 'https://routing.openstreetmap.de/routed-foot/route/v1', profile: 'driving' });
const control = L.Routing.control({
  router, waypoints: [], routeWhileDragging: false, addWaypoints: true, draggableWaypoints: true, fitSelectedRoutes: false, show: false,
  lineOptions: { styles: [{ color: '#534AB7', weight: 5, opacity: 0.85 }] },
  createMarker: (i, wp) => L.marker(wp.latLng, { draggable: true })
}).addTo(map);

function realStops() { return control.getWaypoints().filter(w => w.latLng); }

map.on('click', e => {
  const stops = realStops().map(w => w.latLng);
  stops.push(e.latlng);
  control.setWaypoints(stops);
});
document.getElementById('undo').onclick = () => control.setWaypoints(realStops().slice(0, -1).map(w => w.latLng));
document.getElementById('loop').onclick = () => { const s = realStops().map(w => w.latLng); if (s.length > 1) control.setWaypoints([...s, s[0]]); };
document.getElementById('clear').onclick = () => { control.setWaypoints([]); routeLine = null; recount(); };
document.getElementById('buffer').onchange = e => { bufferM = +e.target.value; recount(); };

control.on('routesfound', e => {
  const r = e.routes[0];
  routeLine = turf.lineString(r.coordinates.map(c => [c.lng, c.lat]));
  const miles = (r.summary.totalDistance / 1609.34).toFixed(2);
  document.getElementById('routeInfo').textContent = `${miles} mi · about ${Math.round(r.summary.totalTime / 60)} min walking`;
  recount();
});
control.on('waypointschanged', () => { if (realStops().length < 2) { routeLine = null; document.getElementById('routeInfo').textContent = 'Tap the map to add stops'; recount(); } });

// Count every home door and place within the chosen distance of the route, and enlarge the ones that count.
function recount() {
  let homeTotal = 0, otherTotal = 0;
  const near = pt => routeLine && turf.pointToLineDistance(pt, routeLine, { units: 'meters' }) <= bufferM;
  homes.forEach(h => {
    const on = near(h.pt);
    if (on) homeTotal += h.n;
    h.marker.setStyle({ color: h.apt ? '#534AB7' : (on ? '#185FA5' : '#5F5E5A'), fillOpacity: on ? 1 : 0.35 });
    h.marker.setRadius(h.apt ? 7 : (on ? 4.5 : 3));
  });
  places.forEach(p => { const on = near(p.pt); if (on) otherTotal += 1; p.marker.setRadius(on ? 10 : 8); });
  document.getElementById('homeCount').textContent = homeTotal.toLocaleString();
  document.getElementById('otherCount').textContent = otherTotal;
}

// Time filter: shown now so the layout is final; it will filter visit logs once the app starts saving them.
document.querySelectorAll('.chips span[data-days]').forEach(c => c.onclick = () => {
  document.querySelectorAll('.chips span[data-days]').forEach(x => x.classList.remove('on'));
  c.classList.add('on');
});
</script>
</body>
</html>
