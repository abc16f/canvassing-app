<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Poncey-Highland canvassing plan</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css">
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, sans-serif; }
  #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; }
  #panel { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 1000; background: #fff;
           border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.2); padding: 10px 12px; font-size: 14px; max-width: 520px; margin: 0 auto; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .stat { flex: 1; background: #f3f2ee; border-radius: 8px; padding: 6px 8px; min-width: 90px; }
  .stat b { display: block; font-size: 20px; }
  .muted { color: #666; font-size: 12px; }
  button { font-size: 13px; padding: 6px 10px; border: 1px solid #bbb; border-radius: 8px; background: #fff; }
  .chips span { display: inline-block; border: 1px solid #bbb; border-radius: 8px; padding: 2px 8px; margin: 2px 2px 0 0; font-size: 12px; cursor: pointer; }
  .chips span.on { background: #e6f1fb; border-color: #378add; color: #0c447c; }
  .leaflet-routing-container { display: none; }
  .legend { background: #fff; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.25); padding: 6px 10px; font-size: 12px; line-height: 1.7; }
  .legend summary { font-weight: 600; cursor: pointer; }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -2px; }
  .addstop { margin-top: 6px; font-size: 13px; padding: 4px 8px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <div class="row" style="justify-content:space-between">
    <b>Poncey-Highland</b>
    <span class="muted" id="routeInfo">Tap anywhere on the map to add a stop</span>
  </div>
  <div class="row" style="margin-top:6px; align-items:stretch">
    <div class="stat"><span class="muted">Homes on route, not apartments</span><b id="homeCount">0</b></div>
    <div class="stat"><span class="muted">Apartment buildings on route</span><b id="aptCount">0</b><span class="muted" id="aptHomes">0 homes inside</span></div>
    <div class="stat"><span class="muted">Other doors on route</span><b id="otherCount">0</b></div>
  </div>
  <div class="chips" style="margin-top:6px"><span class="muted">Visited in last: </span>
    <span data-days="7">7 days</span><span data-days="30" class="on">30 days</span><span data-days="90">90 days</span><span data-days="182">6 months</span><span data-days="365">1 year</span>
  </div>
  <div class="row" style="margin-top:6px">
    <button id="undo">Undo last stop</button>
    <button id="loop">Close the loop</button>
    <button id="clear">Clear route</button>
    <label class="muted">Counts doors within <select id="buffer"><option>30</option><option>40</option><option selected>50</option><option>60</option><option>80</option></select> m</label>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
<script>
// Map centered on Poncey-Highland, with the OpenStreetMap France street map underneath.
const map = L.map('map', { zoomControl: false }).setView([33.7725, -84.3575], 16);
L.control.zoom({ position: 'topright' }).addTo(map);

// Legend in the top-left corner. It folds up so it does not cover the map on a phone.
const legend = L.control({ position: 'topleft' });
legend.onAdd = () => {
  const d = L.DomUtil.create('div', 'legend');
  d.innerHTML = `<details open><summary>Legend</summary>
    <div><span class="sw" style="background:#5F5E5A;width:8px;height:8px"></span>Home door (house, condo, or townhome)</div>
    <div><span class="sw" style="background:#185FA5;width:9px;height:9px"></span>Home door on the route</div>
    <div><span class="sw" style="background:#534AB7"></span>Apartment building (blue ring when on the route)</div>
    <div><span class="sw" style="background:#1D9E75;border:2px solid #fff;box-shadow:0 0 0 1px #ccc"></span>Business or church, visited in the chosen time</div>
    <div><span class="sw" style="background:#BA7517;border:2px solid #fff;box-shadow:0 0 0 1px #ccc"></span>Contacted, not visited, in the chosen time</div>
    <div><span class="sw" style="background:#9FE1CB;border:2px solid #fff;box-shadow:0 0 0 1px #ccc"></span>Visited or contacted before Nov 2026 (exact date unknown)</div>
    <div><span class="sw" style="background:#888780;border:2px solid #fff;box-shadow:0 0 0 1px #ccc"></span>Not visited in the chosen time</div>
    <div><span class="sw" style="background:#888780;border:2px solid #444"></span>Two places share this address</div>
    <div><span style="display:inline-block;width:14px;height:4px;background:#534AB7;margin-right:6px;vertical-align:3px"></span>Walking route</div>
    <div><span style="display:inline-block;width:14px;border-top:2px dashed #534AB7;margin-right:6px;vertical-align:3px"></span>Poncey-Highland boundary</div>
    <div class="muted" style="max-width:190px;line-height:1.3;margin-top:4px">Tap empty map to add a stop. Tap a dot for details, then "Add a stop here."</div>
  </details>`;
  L.DomEvent.disableClickPropagation(d);
  return d;
};
legend.addTo(map);
if (window.innerWidth < 600) legend.getContainer().querySelector('details').removeAttribute('open');
L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', { maxZoom: 19, subdomains: 'abc', attribution: '&copy; OpenStreetMap contributors, OSM France' }).addTo(map);

// Official Poncey-Highland outline from the City of Atlanta. If the city's server blocks the request, the map still works without it.
fetch("https://gis.atlantaga.gov/dpcd/rest/services/AdministrativeArea/GeopoliticalArea/MapServer/1/query?where=NAME%3D'Poncey-Highland'&returnGeometry=true&outSR=4326&f=geojson")
  .then(r => r.json()).then(g => L.geoJSON(g, { style: { color: '#534AB7', weight: 2, fill: false, dashArray: '4 4' } }).addTo(map))
  .catch(() => {});

const STATUS_COLOR = { 'visited': '#1D9E75', 'contacted, not visited': '#BA7517' };
let windowDays = 30;

// A place is colored by its status only if its last visit falls inside the chosen time window.
// Visits logged before the app existed have no exact date, so they get their own pale color in every window.
function placeColor(d) {
  if (!STATUS_COLOR[d.status]) return '#888780';
  if (d.last_visit === 'Before Nov 2026') return '#9FE1CB';
  const when = new Date(d.last_visit);
  if (isNaN(when)) return '#888780';
  return (Date.now() - when) / 86400000 <= windowDays ? STATUS_COLOR[d.status] : '#888780';
}
function refreshPlaceColors() { places.forEach(p => p.marker.setStyle({ fillColor: placeColor(p) })); }
let homes = [], places = [], routeLine = null, bufferM = 50;

// Every dot's pop-up gets a button that adds a route stop at that dot, since tapping a dot opens its details instead.
function addStopButton(d) { return `<br><button class="addstop" onclick="addStopAt(${+d.lat}, ${+d.lon})">Add a stop here</button>`; }
function addStopAt(lat, lon) {
  map.closePopup();
  control.setWaypoints([...realStops().map(w => w.latLng), L.latLng(lat, lon)]);
}

function loadCsv(path) {
  return new Promise((ok, fail) => Papa.parse(path, { download: true, header: true, skipEmptyLines: true, complete: r => ok(r.data), error: fail }));
}

Promise.all([loadCsv('data/home_doors.csv'), loadCsv('data/nonres_public.csv')]).then(([h, p]) => {
  homes = h.map(d => {
    const apt = d.building_type === 'apartment building';
    const label = `${d.building_address}${d.unit ? ', Unit ' + d.unit : ''}<br>${d.building_type} · ${d.home_doors} home door${d.home_doors === '1' ? '' : 's'}`;
    const m = L.circleMarker([+d.lat, +d.lon], { radius: apt ? 7 : 3, color: apt ? '#534AB7' : '#5F5E5A', weight: 1, fillOpacity: 0.7, bubblingMouseEvents: false })
      .bindTooltip(label).bindPopup(label + addStopButton(d)).addTo(map);
    return { ...d, n: +d.home_doors, pt: turf.point([+d.lon, +d.lat]), marker: m, apt };
  });
  places = p.map(d => {
    const label = `<b>${d.name}</b><br>${d.type} · ${d.address}<br>Status: ${d.status}${d.last_visit ? ' (' + d.last_visit + ')' : ''}${d.shared_address_with ? '<br>Shares this address with ' + d.shared_address_with : ''}`;
    const m = L.circleMarker([+d.lat, +d.lon], { radius: 8, color: d.shared_address_with ? '#444' : '#fff', weight: 2, fillColor: placeColor(d), fillOpacity: 1, bubblingMouseEvents: false })
      .bindTooltip(label).bindPopup(label + addStopButton(d)).addTo(map);
    return { ...d, pt: turf.point([+d.lon, +d.lat]), marker: m };
  });
}).catch(e => alert('Could not load the data files: ' + e));

// Walking routes come from the free FOSSGIS routing server, which asks for at most one request per second, so the route redraws only after a drag ends.
const router = L.Routing.osrmv1({ serviceUrl: 'https://routing.openstreetmap.de/routed-foot/route/v1', profile: 'driving' });
const control = L.Routing.control({
  router, waypoints: [], routeWhileDragging: false, addWaypoints: true, draggableWaypoints: true, fitSelectedRoutes: false, show: false,
  lineOptions: { styles: [{ color: '#534AB7', weight: 5, opacity: 0.85 }] },
  createMarker: (i, wp) => L.marker(wp.latLng, { draggable: true })
}).addTo(map);

function realStops() { return control.getWaypoints().filter(w => w.latLng); }

map.on('click', e => {
  const stops = realStops().map(w => w.latLng);
  stops.push(e.latlng);
  control.setWaypoints(stops);
});
document.getElementById('undo').onclick = () => control.setWaypoints(realStops().slice(0, -1).map(w => w.latLng));
document.getElementById('loop').onclick = () => { const s = realStops().map(w => w.latLng); if (s.length > 1) control.setWaypoints([...s, s[0]]); };
document.getElementById('clear').onclick = () => { control.setWaypoints([]); routeLine = null; recount(); };
document.getElementById('buffer').onchange = e => { bufferM = +e.target.value; recount(); };

control.on('routesfound', e => {
  const r = e.routes[0];
  routeLine = turf.lineString(r.coordinates.map(c => [c.lng, c.lat]));
  const miles = (r.summary.totalDistance / 1609.34).toFixed(2);
  document.getElementById('routeInfo').textContent = `${miles} mi · about ${Math.round(r.summary.totalTime / 60)} min walking`;
  recount();
});
control.on('waypointschanged', () => { if (realStops().length < 2) { routeLine = null; document.getElementById('routeInfo').textContent = 'Tap anywhere on the map to add a stop'; recount(); } });

// Count houses and condos, apartment buildings (and the homes inside them), and other places within the chosen distance of the route, and enlarge the ones that count.
function recount() {
  let homeTotal = 0, aptTotal = 0, aptHomes = 0, otherTotal = 0;
  const near = pt => routeLine && turf.pointToLineDistance(pt, routeLine, { units: 'meters' }) <= bufferM;
  homes.forEach(h => {
    const on = near(h.pt);
    if (on && h.apt) { aptTotal += 1; aptHomes += h.n; }
    else if (on) homeTotal += h.n;
    h.marker.setStyle({ color: on ? '#185FA5' : (h.apt ? '#534AB7' : '#5F5E5A'), weight: h.apt && on ? 3 : 1, fillOpacity: on ? 1 : 0.35 });
    h.marker.setRadius(h.apt ? 7 : (on ? 4.5 : 3));
  });
  places.forEach(p => { const on = near(p.pt); if (on) otherTotal += 1; p.marker.setRadius(on ? 10 : 8); });
  document.getElementById('homeCount').textContent = homeTotal.toLocaleString();
  document.getElementById('aptCount').textContent = aptTotal;
  document.getElementById('aptHomes').textContent = `${aptHomes.toLocaleString()} home${aptHomes === 1 ? '' : 's'} inside`;
  document.getElementById('otherCount').textContent = otherTotal;
}

// Time filter: recolors places by whether their last visit falls inside the chosen window.
document.querySelectorAll('.chips span[data-days]').forEach(c => c.onclick = () => {
  document.querySelectorAll('.chips span[data-days]').forEach(x => x.classList.remove('on'));
  c.classList.add('on');
  windowDays = +c.dataset.days;
  refreshPlaceColors();
});
</script>
</body>
</html>
